components:
  schemas:
    AccessDurationEnum:
      enum:
      - 1_month
      - 3_months
      - 6_months
      - full_time
      type: string
      description: |-
        * `1_month` - 1 Month
        * `3_months` - 3 Months
        * `6_months` - 6 Months
        * `full_time` - Full Time
    ActivationCode:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          title: Activation Code
          maxLength: 100
        access_duration:
          $ref: '#/components/schemas/AccessDurationEnum'
        status:
          $ref: '#/components/schemas/ActivationCodeStatusEnum'
        notes:
          type: string
        assigned_student:
          allOf:
          - $ref: '#/components/schemas/CustomUser'
          readOnly: true
        assigned_student_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        assigned_student_name:
          type: string
          maxLength: 255
        date_activated:
          type: string
          format: date-time
          nullable: true
          title: Activation Date
        is_sample:
          type: boolean
          title: Is Sample Code
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_student
      - code
      - created_at
      - id
      - updated_at
    ActivationCodeStatusEnum:
      enum:
      - unused
      - active
      - used
      - expired
      - revoked
      type: string
      description: |-
        * `unused` - Unused
        * `active` - Active
        * `used` - Used
        * `expired` - Expired
        * `revoked` - Revoked
    Bookmark:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/Course'
          readOnly: true
        course_id:
          type: string
          writeOnly: true
        question:
          allOf:
          - $ref: '#/components/schemas/Question'
          readOnly: true
        question_id:
          type: string
          writeOnly: true
        course_code:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - course_id
      - created_at
      - id
      - question
      - question_id
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 6
      required:
      - new_password
      - old_password
    CorrectAnswerEnum:
      enum:
      - A
      - B
      - C
      - D
      type: string
      description: |-
        * `A` - Option A
        * `B` - Option B
        * `C` - Option C
        * `D` - Option D
    Course:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        code:
          type: string
          title: Course Code
          maxLength: 50
        title:
          type: string
          title: Course Title
          maxLength: 255
        description:
          type: string
        level:
          type: string
          title: Academic Level
          maxLength: 20
        icon:
          type: string
          title: Icon / Emoji
          maxLength: 100
        question_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_active:
          type: boolean
        department:
          allOf:
          - $ref: '#/components/schemas/Department'
          readOnly: true
        department_id:
          type: string
          writeOnly: true
          nullable: true
        department_name:
          type: string
          title: Department Name Override
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - department
      - id
      - title
      - updated_at
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    CustomUser:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          $ref: '#/components/schemas/CustomUserStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - updated_at
    CustomUserStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    Department:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          title: Department Name
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
        levels:
          title: Available Levels
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - Easy
        * `medium` - Medium
        * `hard` - Hard
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    MockExamResult:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/Course'
          readOnly: true
        course_id:
          type: string
          writeOnly: true
        course_code:
          type: string
          maxLength: 50
        total_questions:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        correct_answers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        wrong_answers:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unanswered:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Unanswered Questions
        score_percentage:
          type: number
          format: double
        time_spent_seconds:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
