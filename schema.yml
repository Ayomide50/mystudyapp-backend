      - refresh
    Topic:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/Course'
          readOnly: true
        course_id:
          type: string
          writeOnly: true
        title:
          type: string
          title: Topic Title
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - course_id
      - created_at
      - id
      - title
      - updated_at
    TypeEnum:
      enum:
      - info
      - success
      - warning
      - system
      type: string
      description: |-
        * `info` - Information
        * `success` - Success
        * `warning` - Warning
        * `system` - System Broadcast
    WithdrawalRequest:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/CustomUser'
          readOnly: true
        referral_code:
          type: string
          maxLength: 50
        full_name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          title: Email Address
          maxLength: 254
        bank_name:
          type: string
          maxLength: 100
        account_number:
          type: string
          maxLength: 50
        account_name:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Withdrawal Amount
        status:
          $ref: '#/components/schemas/WithdrawalRequestStatusEnum'
        paid_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_name
      - account_number
      - amount
      - bank_name
      - created_at
      - email
      - full_name
      - id
      - updated_at
      - user
    WithdrawalRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - paid
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `paid` - Paid
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
